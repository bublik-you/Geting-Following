name: Publish the offline infographics ZIP

on:
  push:
    branches: [download/infographics-offline]
    paths:
      - .github/workflows/publish-infographics-offline.yml
      - presentation-2/offline/infographics-offline.zip

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the ZIP contains the approved offline presentation
        run: |
          archive=presentation-2/offline/infographics-offline.zip
          unzip -t "$archive"
          test "$(unzip -Z1 "$archive")" = infographics.html
          unzip -p "$archive" infographics.html | cmp - presentation-2/offline/infographics.html
      - name: Add the ZIP to the public offline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=presentation-2/offline/infographics-offline.zip
          if gh release download infographics-offline-v1 --pattern infographics-offline.zip --dir "$RUNNER_TEMP" 2>/dev/null; then
            cmp "$archive" "$RUNNER_TEMP/infographics-offline.zip"
          else
            gh release upload infographics-offline-v1 "$archive"
          fi
