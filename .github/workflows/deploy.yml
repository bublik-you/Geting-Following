name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test both presentations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            presentation-2/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked dependencies for presentation 2
        run: npm --prefix presentation-2 ci
      - name: Build Four Cats
        run: npm run build
      - name: Build presentation 2
        run: npm --prefix presentation-2 run build
      - name: Assemble both presentations for GitHub Pages
        run: npm --prefix presentation-2 run assemble:pages
      - name: Prepare Chrome for browser checks
        run: |
          if browser=$(command -v google-chrome); then
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            npm --prefix presentation-2 exec -- playwright install chromium
          fi
      - name: Test Four Cats and all scenes
        run: npm test
      - name: Test both presentations and offline cache isolation
        run: npm --prefix presentation-2 run test:pages
      - name: Package standalone HTML and print summary
        run: npm run package:offline
      - name: Upload offline presentation and A4 summary
        uses: actions/upload-artifact@v4
        with:
          name: four-cats-offline
          path: |
            offline/four-cats-offline.zip
            offline/executive-summary.pdf
      - name: Package offline infographics presentation
        run: npm --prefix presentation-2 run package:offline
      - name: Upload offline infographics presentation
        uses: actions/upload-artifact@v4
        with:
          name: infographics-offline
          path: presentation-2/offline/infographics-offline.zip
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation-2/pages-dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live HTTPS website
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            presentation-2/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked dependencies for presentation 2
        run: npm --prefix presentation-2 ci
      - name: Prepare Chrome for browser checks
        run: |
          if browser=$(command -v google-chrome); then
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            npm --prefix presentation-2 exec -- playwright install chromium
          fi
      - name: Verify deployment URL
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo 'Expected an HTTPS deployment URL'; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$DEPLOYMENT_URL" --output /dev/null
      - name: Test all scenes on the published website
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm test
      - name: Test both published URLs and offline cache isolation
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm --prefix presentation-2 run test:pages
