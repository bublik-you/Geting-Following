,re,ie,ue],tt=[{title:"Информационный хаос",short:"Хаос",seconds:35,cue:"На пару секунд уменьшите шум, затем перетащите слово в центр и откройте сеть. Всего около 8 секунд на действия.",speech:"Попробуйте быстро найти на экране что-нибудь важное. Цифры, стрелки и слова видны одновременно, и каждому легко принять себя за главное. Уменьшим шум и перетащим «Смысл» в центр. Те же фрагменты займут связанные места, и появится порядок. Когда у элементов есть иерархия, нам проще решить, куда смотреть сначала. Сегодня я покажу, как презентация может помочь проделать эту работу."},{title:"Масштабируемая сеть",short:"Сеть",seconds:60,cue:"Приблизьте схему, откройте одну боковую ветвь и вернитесь к общему виду. В конце нажмите «Понимание» и проследите за линиями. На жесты около 12 секунд.",speech:"В центре схемы — визуальная коммуникация. От неё идут четыре ветви. Внимание помогает выбрать, куда смотреть. Понимание связывает отдельные факты. Память позволяет вернуться к увиденному позже. Суждение — это то, какой вывод мы делаем. Приблизим сеть. На общем плане видны связи, а детали появляются только по запросу. Близость и видимые соединения помогают воспринимать узлы как группу. Эти закономерности описывает гештальт-психология. Инфографика полезна, когда группировка отражает реальные отношения между фактами. Теперь посмотрим, как это работает для количественных данных. Выберем ветвь «Понимание»."},{title:"Связанные графики",short:"Графики",seconds:75,cue:"Поднимите «Графику» и сравните проценты с макетом. Последние 10 секунд оставьте на подъём правой колонки и её отпускание у потолка.",speech:"Представьте, что площадь экрана равна ста процентам. Мы отдали тридцать пять тексту, сорок графике и двадцать пять свободному пространству. Это условная модель. Поднимем графику. Её доля растёт, а два других участка делят оставшуюся площадь в прежней пропорции. Справа изменяется сам макет, поэтому видно, какой ценой мы увеличили изображение. Свободное пространство тоже выполняет работу. Оно отделяет группы и оставляет место для акцента. В исследованиях Кливленда и Макгилла сравнение позиций на общей шкале обычно давало более точные оценки, чем некоторые другие способы кодировать величину, например площадью. Здесь за точные числа отвечают шкала и подписи, а макет показывает последствия для композиции. Теперь потянем правую колонку выше. Обратите внимание, что доли уже не меняются. Потянем ещё и отпустим колонку, чтобы пройти сквозь потолок."},{title:"Управление вниманием",short:"Внимание",seconds:65,cue:"Осветите заголовок, диаграмму и вывод. Свет соберётся в экран. Дайте персонажу пройти маршрут. Оставьте 10–12 секунд на прожектор и мини-сцену.",speech:"В тёмном зале все элементы остаются на месте. Передвинем прожектор на диаграмму. Теперь она заметнее, а остальные элементы можно изучить позже. Избирательное внимание помогает сосредоточиться на задаче, и при этом часть доступной информации легко пропустить. В презентации мы можем управлять очередностью с помощью контраста, расположения и появления объектов. Вопрос, связь и вывод раскрываются по очереди. В миниатюре персонаж проходит тот же путь от ствола к ветвям. Этот порядок задаёт рассказ. Движение полезно, если оно показывает, где находится новая информация и как она связана с предыдущей. Лишние эффекты тоже претендуют на внимание. В мультимедийном обучении Майер выделяет сигналы, которые направляют зрителя к структуре материала. От дерева теперь останутся отдельные образы."},{title:"Как визуализация влияет на память",short:"Память",seconds:50,cue:"Соедините «Рост» и «Связь». Двух пар достаточно. На действия отведите около 10 секунд.",speech:"Соединим рост с восходящей линией, а связь — с соединёнными узлами. Подпись уточняет, какой смысл мы вкладываем в образ. Когда объяснение и подходящая графика расположены рядом, человеку проще сопоставить их. Майер описывает такой приём как пространственную близость. Боркин с коллегами исследовали, какие визуализации люди узнавали при повторной встрече. Узнавание измеряет один аспект памяти. Запомнить изображение — не значит правильно понять информацию. Наши пары иллюстрируют этот принцип. Для проверки понимания можно попросить зрителя своими словами объяснить связь или применить её к новому примеру."},{title:"Влияние инфографики на суждения",short:"Суждение",seconds:55,cue:"Включите наложение, затем снова выберите обрезанный вариант и потяните правую шкалу к нулю. На действия около 12 секунд.",speech:"На обеих диаграммах одни и те же условные значения: шестьдесят восемь и семьдесят четыре. Слева столбцы начинаются от нуля, справа — от шестидесяти пяти. Поэтому справа различие кажется намного больше. Опустим начало шкалы до нуля. Мы изменили масштаб, но числа остались прежними. При наложении контур показывает, какой была высота столбцов на обрезанной шкале. Для столбцов длина кодирует величину, поэтому нулевая база обычно помогает сравнивать их честно. Линзой можно проверить деления, единицы и сами значения. Когда нужна крупная детализация, обозначьте масштаб явно и выберите такой график, который поддерживает требуемое сравнение."},{title:"Сборка главной мысли",short:"Связи",seconds:30,cue:"Проведите через четыре понятия и дождитесь песка. Около 8 секунд на жест и переход.",speech:"Соберём четыре понятия в одну линию. Внимание помогает заметить нужное. Понимание позволяет связать увиденное с вопросом. Память сохраняет часть информации. Суждение возникает, когда мы интерпретируем эту информацию. Один дизайн может хорошо привлекать внимание и при этом мешать точному сравнению. Поэтому сначала стоит определить, какую задачу зритель должен решить."},{title:"Финал с веником и песком",short:"Финал",seconds:50,cue:"Возьмите веник и очистите центральную область. Оставьте 15 секунд на действие и паузу после появления вывода.",speech:"И наконец, уберём всё лишнее, чтобы увидеть главную мысль. Буквы открываются там, где проходит щётка. По мере очистки из отдельных фрагментов складывается предложение. Сила инфографики и презентаций — в способности превращать информацию в понимание. Визуальная информация помогает направлять внимание, видеть связи, поддерживать память и формировать суждения. Её ценность определяется точностью переданного смысла. Если после выступления человек может объяснить главную мысль и понять, на чём она основана, визуальная форма выполнила свою задачу. Спасибо за внимание!"}],kt=tt.reduce((t,n)=>t+n.seconds,0),it=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`,Mt=t=>tt.slice(0,t).reduce((n,a)=>n+a.seconds,0),Ht="infographics-presentation-2-notes";function pe(){document.body.innerHTML='<main class="speaker-window"><header><div><p>Заметки докладчика</p><h1></h1></div><output></output></header><p class="speaker-cue"></p><div class="speaker-speech"></div><p class="speaker-next"></p></main>';const t=s(document,".speaker-window");function n(){let a={index:0,started:null};try{const h=JSON.parse(localStorage.getItem(Ht)??"null");h&&tt[h.index]&&(a=h)}catch{}const{index:c,started:e}=a,o=tt[c];s(t,"h1").textContent=o.title,s(t,"output").textContent=`${it(qt(e))} / ${it(kt)}`,s(t,".speaker-cue").textContent=`${it(Mt(c))}–${it(Mt(c)+o.seconds)} · ${o.cue}`,s(t,".speaker-speech").textContent=o.speech,s(t,".speaker-next").textContent=tt[c+1]?`Далее · ${tt[c+1].title}`:"Финальная сцена"}n(),window.addEventListener("storage",n),window.setInterval(n,500)}const qt=t=>t===null?0:Math.floor(Math.max(0,Date.now()-t)/1e3);function he(){const t=s(document,"#presentation-2"),n=s(t,"#scene"),a=document.createElement("div");a.className="stage-space",n.before(a),a.append(n);const c=s(t,"#menu"),e=s(t,"#clock"),o=s(t,"#present"),h=s(t,"#skip"),x=s(t,"#sound"),y=s(t,"#progress"),j=s(t,"#chapter-list");let $=0,R=new AbortController,A,b=null,u=!1,g;function w(){try{localStorage.setItem(Ht,JSON.stringify({index:$,started:b}))}catch{}}function i(){const r=qt(b);e.value=`${it(r)} / ${it(kt)}`,e.classList.toggle("overtime",b!==null&&r>=kt)}function l(r="tap"){if(!u||!g||g.state!=="running")return
